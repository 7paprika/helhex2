[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helhex2"
version = "0.1.0"
description = "Streamlit helical tube heat exchanger design calculator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit",
  "numpy",
  "plotly",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
